<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maya's Learning</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    font-family: "Segoe UI", Arial, Helvetica, sans-serif;
    color: #fff;
    background: #0b1026;
    background-image:
      radial-gradient(900px 600px at 15% 10%, rgba(124, 58, 237, 0.45), transparent 60%),
      radial-gradient(800px 600px at 85% 20%, rgba(236, 72, 153, 0.35), transparent 60%),
      radial-gradient(900px 700px at 50% 100%, rgba(34, 211, 238, 0.28), transparent 60%),
      linear-gradient(160deg, #0b1026 0%, #1b1445 55%, #0b1026 100%);
    background-attachment: fixed;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px 32px;
    overflow-x: hidden;
  }
  .orb { position: fixed; border-radius: 50%; filter: blur(70px); opacity: 0.5; pointer-events: none; z-index: 0; animation: float 14s ease-in-out infinite alternate; }
  .orb.o1 { width: 340px; height: 340px; background: #7c3aed; top: -80px; left: -60px; }
  .orb.o2 { width: 300px; height: 300px; background: #ec4899; bottom: -60px; right: -40px; animation-delay: -6s; }
  .orb.o3 { width: 220px; height: 220px; background: #22d3ee; top: 55%; left: 8%; animation-delay: -3s; opacity: 0.35; }
  @keyframes float { from { transform: translateY(-18px); } to { transform: translateY(22px); } }
  header { position: relative; z-index: 1; text-align: center; margin-bottom: 44px; }
  h1 {
    font-size: 68px; line-height: 1.05; margin: 0 0 12px; letter-spacing: -1px;
    background: linear-gradient(90deg, #fde68a, #fda4af 45%, #a5b4fc);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 60px rgba(253, 164, 175, 0.25);
  }
  header p { font-size: 26px; color: #c7d2fe; margin: 0; }
  .scene { position: relative; z-index: 1; display: flex; gap: 36px; flex-wrap: wrap; justify-content: center; perspective: 1400px; }
  .card {
    position: relative; display: block; width: 420px; max-width: 92vw; min-height: 380px;
    border-radius: 32px; padding: 40px 36px 34px; text-decoration: none; color: #fff;
    transform-style: preserve-3d;
    transition: transform 0.35s ease, box-shadow 0.35s ease;
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.55), 0 4px 0 rgba(255, 255, 255, 0.12) inset, 0 -18px 40px rgba(0, 0, 0, 0.25) inset;
    overflow: hidden;
  }
  .card::before {
    content: ""; position: absolute; inset: 0; border-radius: 32px;
    background: linear-gradient(115deg, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0.06) 30%, transparent 55%);
    pointer-events: none;
  }
  .card::after {
    content: ""; position: absolute; left: 10%; right: 10%; bottom: -18px; height: 36px; border-radius: 50%;
    background: rgba(0, 0, 0, 0.5); filter: blur(18px); z-index: -1;
  }
  .card.doctor { background: linear-gradient(150deg, #fb7185 0%, #e11d48 55%, #9f1239 100%); }
  .card.quizzes { background: linear-gradient(150deg, #34d399 0%, #059669 55%, #065f46 100%); }
  .card:hover, .card:focus-visible { transform: translateY(-14px) rotateX(5deg) rotateY(-5deg) scale(1.02); box-shadow: 0 44px 80px rgba(0, 0, 0, 0.6), 0 4px 0 rgba(255, 255, 255, 0.18) inset, 0 -18px 40px rgba(0, 0, 0, 0.25) inset; }
  .card:focus-visible { outline: 4px solid #fff; outline-offset: 6px; }
  .icon {
    width: 110px; height: 110px; border-radius: 50%; margin-bottom: 26px;
    display: flex; align-items: center; justify-content: center; font-size: 56px;
    background: rgba(255, 255, 255, 0.22); border: 1px solid rgba(255, 255, 255, 0.45);
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.3), inset 0 2px 6px rgba(255, 255, 255, 0.5);
    transform: translateZ(40px);
  }
  .card h2 { font-size: 40px; line-height: 1.15; margin: 0 0 12px; transform: translateZ(30px); }
  .card p { font-size: 23px; line-height: 1.45; margin: 0 0 26px; color: rgba(255, 255, 255, 0.92); transform: translateZ(20px); }
  .go {
    display: inline-block; font-size: 22px; font-weight: bold; padding: 14px 26px; border-radius: 999px;
    background: rgba(255, 255, 255, 0.95); color: #1e1b4b; transform: translateZ(30px);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
  }
  footer { position: relative; z-index: 1; margin-top: 48px; font-size: 19px; color: #94a3b8; letter-spacing: 1px; }
  @media (max-width: 700px) {
    h1 { font-size: 44px; }
    header p { font-size: 20px; }
    .card { min-height: 0; padding: 30px 26px; }
    .card h2 { font-size: 32px; }
    .card p { font-size: 20px; }
    .icon { width: 88px; height: 88px; font-size: 44px; }
  }
</style>
</head>
<body>
<div class="orb o1"></div>
<div class="orb o2"></div>
<div class="orb o3"></div>

<header>
  <h1>Maya's Learning</h1>
  <p>Choose where to go</p>
</header>

<div class="scene">
  <a class="card doctor" href="https://zmnakoahmed.github.io/maya-quizzes/maya-medicine-journey.html">
    <div class="icon">🩺</div>
    <h2>How to Become a Doctor</h2>
    <p>Maya's journey from 4th class all the way to doctor, in Ireland, the UK and Oxford.</p>
    <span class="go">Open the journey →</span>
  </a>

  <a class="card quizzes" href="https://zmnakoahmed.github.io/quizzes.html">
    <div class="icon">✏️</div>
    <h2>Quizzes</h2>
    <p>Maths, Spanish and Science quizzes. Pick one and play.</p>
    <span class="go">See all quizzes →</span>
  </a>
</div>

<footer>Made for Maya</footer>
</body>
</html>
